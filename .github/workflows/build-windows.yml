name: Validate course and build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-course:
    name: Validate Russian course content
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Run content tests
        run: python -m unittest discover -s tests -v
      - name: Validate course data
        run: python scripts/validate_course.py

  build-windows:
    name: Publish self-contained Windows x64 app
    runs-on: windows-latest
    needs: validate-course
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows application
        run: >-
          dotnet publish src/GitHubCourse/GitHubCourse.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/GitHubCourse-win-x64
      - name: Create downloadable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'artifacts/GitHubCourse-win-x64/*' -DestinationPath 'artifacts/GitHubCourse-win-x64.zip' -Force
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: GitHubCourse-Windows-x64
          path: artifacts/GitHubCourse-win-x64.zip
          if-no-files-found: error
          retention-days: 14
