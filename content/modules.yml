# Порядок модулей курса. Порядок уроков внутри модуля задаётся полем order
# во front matter файла урока (или числовым префиксом имени файла).
# Добавляя модуль, создайте каталог content/<dir>/ и положите туда уроки и,
# при желании, index.md с обзором модуля (иначе обзор соберётся автоматически).
